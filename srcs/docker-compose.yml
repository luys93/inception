services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    image: mariadb:inception
    restart: always
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    image: wordpress:inception
    restart: always
    depends_on:
      - mariadb
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    image: nginx:inception
    restart: always
    depends_on:
      - wordpress
    environment:
      - NGINX_PORT=${NGINX_PORT}
      - WP_PORT=${WP_PORT}
    ports:
      - "${NGINX_PORT}:${NGINX_PORT}"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

networks:
  inception:
    driver: bridge

volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/lluciani/data/wordpress
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/lluciani/data/mariadb
