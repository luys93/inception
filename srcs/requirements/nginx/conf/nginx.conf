events{}

http {
		include /etc/nginx/mime.types;
		server {
			listen			${NGINX_PORT} ssl;
			server_name		lluciani.42.fr;
			ssl_certificate /etc/nginx/ssl/lluciani.42.fr.crt;
			ssl_certificate_key /etc/nginx/ssl/lluciani.42.fr.key;
			ssl_protocols		TLSv1.2	TLSv1.3;

			#dove cercare i file
			root /var/www/html;
			index index.php;
	
			#prova il file esatto, poi la cartella, senno manda tutto a php
			location / {
				try_files $uri $uri/ /index.php?$args; 
			}

			location ~ \.php$ {
				#se il file .php non esiste, 404 invece di passarlo a php-fpm
				try_files $uri =404;
				include fastcgi_params;
				fastcgi_pass wordpress:${WP_PORT};
				fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			}
		}
	}